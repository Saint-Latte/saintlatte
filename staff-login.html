<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Saint Latte — Acceso de personal.">
  <title>Acceso staff — Saint Latte</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/funtastic" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .staff-section { max-width: 460px; margin: 0 auto; padding: 60px 24px 100px; }
    .staff-panel {
      background: var(--black-mid); border: 1px solid rgba(255,254,249,.12);
      padding: 2rem;
    }
    .staff-msg { font-size: .85rem; color: var(--rust); margin-top: 1rem; min-height: 1.2em; }
    .staff-password-row { position: relative; }
    .staff-password-row .order-field__input { padding-right: 4.4rem; }
    .staff-password-toggle {
      position: absolute; right: .7rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: none; padding: 0;
      font-size: .6rem; letter-spacing: .08em; font-weight: 700; color: rgba(255,254,249,.4);
    }
    .staff-password-toggle:hover { color: var(--cream); }
    .staff-forgot-link {
      display: block; background: none; border: none; cursor: none; padding: 0; margin-top: .9rem;
      font-size: .72rem; color: rgba(255,254,249,.45); text-decoration: underline;
    }
    .staff-forgot-link:hover { color: var(--cream); }
  </style>
</head>
<body class="page-testing">

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__brand">
      <img src="assets/images/logo.png" alt="Saint Latte" class="nav__logo-img" onerror="this.style.display='none'">
      <span class="nav__brand-text">SAINT LATTE</span>
    </a>
    <ul class="nav__links" role="list">
      <li><a href="index.html" class="nav__link nav__link--cta">← INICIO</a></li>
    </ul>
    <button class="nav__hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu__inner">
      <ul class="mobile-menu__list" role="list">
        <li><a href="index.html" class="mobile-link">← INICIO</a></li>
      </ul>
    </div>
  </div>

  <!-- HERO -->
  <header class="page-hero page-hero--dark">
    <div class="page-hero__content">
      <span class="section-label" style="color:rgba(255,254,249,.6)">USO INTERNO</span>
      <h1 class="page-hero__title">
        ACCESO<br><em>STAFF.</em>
      </h1>
      <p class="page-hero__sub">Inicia sesión con tu cuenta de personal.</p>
    </div>
    <div class="page-hero__bg-num" aria-hidden="true">SL</div>
  </header>

  <section class="staff-section">
    <div class="staff-panel">
      <div id="loginFormWrap">
        <div class="order-fieldset" style="padding:0;border:none">
          <div class="order-field">
            <label class="order-field__label">EMAIL</label>
            <input class="order-field__input" type="email" id="loginEmail" autocomplete="username">
          </div>
          <div class="order-field">
            <label class="order-field__label">CONTRASEÑA</label>
            <div class="staff-password-row">
              <input class="order-field__input" type="password" id="loginPassword" autocomplete="current-password">
              <button type="button" class="staff-password-toggle" id="togglePasswordBtn">VER</button>
            </div>
          </div>
          <button class="btn btn--solid" id="loginBtn" style="margin-top:.5rem">ENTRAR</button>
          <button type="button" class="staff-forgot-link" id="forgotLinkBtn">¿Olvidaste tu contraseña?</button>
          <button type="button" class="staff-forgot-link" id="registerLinkBtn">¿Eres nuevo? Crea tu cuenta</button>
          <p class="staff-msg" id="loginMsg" hidden></p>
        </div>
      </div>

      <div id="forgotFormWrap" hidden>
        <div class="order-fieldset" style="padding:0;border:none">
          <div class="order-legend" style="margin-bottom:1.5rem">RECUPERAR CONTRASEÑA</div>
          <div class="order-field">
            <label class="order-field__label">EMAIL</label>
            <input class="order-field__input" type="email" id="forgotEmail" autocomplete="username">
          </div>
          <button class="btn btn--solid" id="forgotBtn" style="margin-top:.5rem">ENVIAR ENLACE</button>
          <button type="button" class="staff-forgot-link" id="backToLoginBtn">← Volver a iniciar sesión</button>
          <p class="staff-msg" id="forgotMsg" hidden></p>
        </div>
      </div>

      <div id="registerFormWrap" hidden>
        <div class="order-fieldset" style="padding:0;border:none">
          <div class="order-legend" style="margin-bottom:1.5rem">CREAR CUENTA</div>
          <div class="order-field">
            <label class="order-field__label">EMAIL</label>
            <input class="order-field__input" type="email" id="regEmail" autocomplete="username">
          </div>
          <div class="order-field">
            <label class="order-field__label">CONTRASEÑA</label>
            <input class="order-field__input" type="password" id="regPassword" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          </div>
          <div class="order-field">
            <label class="order-field__label">CONFIRMAR CONTRASEÑA</label>
            <input class="order-field__input" type="password" id="regPasswordConfirm" autocomplete="new-password">
          </div>
          <p class="staff-note" style="margin:0 0 1rem;font-size:.78rem;color:rgba(255,254,249,.45);line-height:1.6">
            Tu cuenta queda pendiente de aprobación — un miembro del staff tiene que confirmarla antes de que puedas entrar.
          </p>
          <button class="btn btn--solid" id="registerBtn">CREAR CUENTA</button>
          <button type="button" class="staff-forgot-link" id="backToLoginFromRegisterBtn">← Volver a iniciar sesión</button>
          <p class="staff-msg" id="registerMsg" hidden></p>
        </div>
      </div>
    </div>
  </section>

  <script src="main.js"></script>
  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

    const params = new URLSearchParams(window.location.search);
    const nextPage = params.get('next');
    const loginMsg = document.getElementById('loginMsg');

    function showOnlyLogin() {
      document.getElementById('forgotFormWrap').hidden = true;
      document.getElementById('registerFormWrap').hidden = true;
      loginFormWrap.hidden = false;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return; // se queda mostrando el formulario de login
      try {
        const staffSnap = await getDoc(doc(db, 'staff', user.uid));
        if (staffSnap.exists()) {
          window.location.href = nextPage || 'staff-panel.html';
          return;
        }
        const pendingSnap = await getDoc(doc(db, 'pendingStaff', user.uid));
        await signOut(auth);
        showOnlyLogin();
        if (pendingSnap.exists()) {
          loginMsg.style.color = 'var(--green)';
          loginMsg.textContent = 'Tu cuenta ya está creada y pendiente de aprobación por otro miembro del staff.';
        } else {
          loginMsg.style.color = 'var(--rust)';
          loginMsg.textContent = 'Esta cuenta no tiene permisos de personal.';
        }
        loginMsg.hidden = false;
      } catch (err) {
        await signOut(auth).catch(() => {});
        loginMsg.style.color = 'var(--rust)';
        loginMsg.textContent = 'No se pudo verificar la cuenta. Intenta de nuevo.';
        loginMsg.hidden = false;
      }
    });

    async function trySubmit() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      loginMsg.hidden = true;
      if (!email || !password) {
        loginMsg.textContent = 'Escribe tu email y contraseña.';
        loginMsg.hidden = false;
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        // el chequeo de rol + redirect lo dispara el listener de onAuthStateChanged
      } catch (err) {
        loginMsg.style.color = 'var(--rust)';
        loginMsg.textContent = 'No se pudo iniciar sesión. Revisa tu email y contraseña.';
        loginMsg.hidden = false;
      }
    }

    document.getElementById('loginBtn').addEventListener('click', trySubmit);
    document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') trySubmit(); });

    // ═══ Mostrar/ocultar contraseña ═══
    document.getElementById('togglePasswordBtn').addEventListener('click', () => {
      const input = document.getElementById('loginPassword');
      const btn = document.getElementById('togglePasswordBtn');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.textContent = showing ? 'VER' : 'OCULTAR';
    });

    // ═══ Recuperar contraseña ═══
    const loginFormWrap = document.getElementById('loginFormWrap');
    const forgotFormWrap = document.getElementById('forgotFormWrap');
    const forgotMsg = document.getElementById('forgotMsg');

    document.getElementById('forgotLinkBtn').addEventListener('click', () => {
      document.getElementById('forgotEmail').value = document.getElementById('loginEmail').value;
      forgotMsg.hidden = true;
      loginFormWrap.hidden = true;
      forgotFormWrap.hidden = false;
    });
    document.getElementById('backToLoginBtn').addEventListener('click', () => {
      forgotFormWrap.hidden = true;
      loginFormWrap.hidden = false;
    });

    async function trySendReset() {
      const email = document.getElementById('forgotEmail').value.trim();
      forgotMsg.hidden = true;
      if (!email) {
        forgotMsg.style.color = 'var(--rust)';
        forgotMsg.textContent = 'Escribe tu email.';
        forgotMsg.hidden = false;
        return;
      }
      // Se muestra el mismo mensaje exista o no la cuenta, para no revelar
      // qué emails están registrados.
      try { await sendPasswordResetEmail(auth, email); } catch (err) { /* silencioso a propósito */ }
      forgotMsg.style.color = 'var(--green)';
      forgotMsg.textContent = `Si ${email} tiene una cuenta de personal, le llegará un correo con instrucciones para restablecer la contraseña. Revisa también spam.`;
      forgotMsg.hidden = false;
    }

    document.getElementById('forgotBtn').addEventListener('click', trySendReset);
    document.getElementById('forgotEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') trySendReset(); });

    // ═══ Crear cuenta (queda pendiente de aprobación) ═══
    const registerFormWrap = document.getElementById('registerFormWrap');
    const registerMsg = document.getElementById('registerMsg');

    document.getElementById('registerLinkBtn').addEventListener('click', () => {
      document.getElementById('regEmail').value = document.getElementById('loginEmail').value;
      registerMsg.hidden = true;
      loginFormWrap.hidden = true;
      registerFormWrap.hidden = false;
    });
    document.getElementById('backToLoginFromRegisterBtn').addEventListener('click', () => {
      registerFormWrap.hidden = true;
      loginFormWrap.hidden = false;
    });

    async function tryRegister() {
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regPasswordConfirm').value;
      registerMsg.hidden = true;
      if (!email || password.length < 6) {
        registerMsg.style.color = 'var(--rust)';
        registerMsg.textContent = 'Escribe un email y una contraseña de al menos 6 caracteres.';
        registerMsg.hidden = false;
        return;
      }
      if (password !== confirmPassword) {
        registerMsg.style.color = 'var(--rust)';
        registerMsg.textContent = 'Las contraseñas no coinciden.';
        registerMsg.hidden = false;
        return;
      }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, 'pendingStaff', cred.user.uid), { email, requestedAt: serverTimestamp() });
        // el listener de onAuthStateChanged detecta la sesión nueva, ve que
        // no es staff pero sí está pendiente, cierra la sesión y muestra el
        // mensaje de "pendiente de aprobación" en el panel de login.
      } catch (err) {
        registerMsg.style.color = 'var(--rust)';
        registerMsg.textContent = err.code === 'auth/email-already-in-use'
          ? 'Ese email ya tiene una cuenta. Inicia sesión o recupera tu contraseña.'
          : 'No se pudo crear la cuenta. Intenta de nuevo.';
        registerMsg.hidden = false;
      }
    }

    document.getElementById('registerBtn').addEventListener('click', tryRegister);
    document.getElementById('regPasswordConfirm').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryRegister(); });
  </script>
</body>
</html>

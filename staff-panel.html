<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Saint Latte — Panel de personal.">
  <title>Panel de staff — Saint Latte</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/funtastic" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .staff-section { max-width: 560px; margin: 0 auto; padding: 60px 24px 100px; }
    .staff-panel {
      background: var(--black-mid); border: 1px solid rgba(255,254,249,.12);
      padding: 2rem; margin-bottom: 2rem;
    }
    .staff-note { font-size: .8rem; color: rgba(255,254,249,.45); line-height: 1.7; margin-top: 1rem; }
    .staff-msg { font-size: .85rem; color: var(--rust); margin-top: 1rem; min-height: 1.2em; }
    .staff-session { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .staff-session span { font-size: .78rem; color: rgba(255,254,249,.5); }
    .staff-roster { list-style: none; display: flex; flex-direction: column; gap: .4rem; margin-top: 1rem; }
    .staff-roster li { font-size: .8rem; color: rgba(255,254,249,.5); }
  </style>
</head>
<body class="page-testing">

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- NAV -->
  <nav class="nav" id="nav">
    <a href="index.html" class="nav__brand">
      <img src="assets/images/logo.png" alt="Saint Latte" class="nav__logo-img" onerror="this.style.display='none'">
      <span class="nav__brand-text">SAINT LATTE</span>
    </a>
    <ul class="nav__links" role="list">
      <li><a href="inventario.html" class="nav__link">INVENTARIO</a></li>
      <li><a href="index.html" class="nav__link nav__link--cta">← INICIO</a></li>
    </ul>
    <button class="nav__hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
      <span class="hamburger__bar"></span>
    </button>
  </nav>

  <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
    <div class="mobile-menu__inner">
      <ul class="mobile-menu__list" role="list">
        <li><a href="inventario.html" class="mobile-link">INVENTARIO</a></li>
        <li><a href="index.html" class="mobile-link">← INICIO</a></li>
      </ul>
    </div>
  </div>

  <!-- HERO -->
  <header class="page-hero page-hero--dark">
    <div class="page-hero__content">
      <span class="section-label" style="color:rgba(255,254,249,.6)">USO INTERNO</span>
      <h1 class="page-hero__title">
        PANEL DE<br><em>PERSONAL.</em>
      </h1>
      <p class="page-hero__sub">Da de alta cuentas de personal nuevas.</p>
    </div>
    <div class="page-hero__bg-num" aria-hidden="true">SL</div>
  </header>

  <section class="staff-section">
    <div class="staff-session">
      <span id="sessionLabel"></span>
      <button class="btn btn--solid" id="logoutBtn">CERRAR SESIÓN</button>
    </div>

    <div class="staff-panel">
      <div class="order-fieldset" style="padding:0;border:none">
        <div class="order-legend" style="margin-bottom:1.5rem">NUEVA CUENTA DE PERSONAL</div>
        <div class="order-field">
          <label class="order-field__label">EMAIL</label>
          <input class="order-field__input" type="email" id="staffEmail" placeholder="ej. jarron-azul@saintlatte.com">
        </div>
        <div class="order-field">
          <label class="order-field__label">CONTRASEÑA</label>
          <input class="order-field__input" type="password" id="staffPassword" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn btn--solid" id="addStaffBtn" style="margin-top:.5rem">CREAR CUENTA DE PERSONAL</button>
        <p class="staff-msg" id="addStaffMsg" hidden></p>
        <p class="staff-note">La cuenta queda lista para iniciar sesión de inmediato en esta misma página.</p>
      </div>
      <ul class="staff-roster" id="staffRoster"></ul>
    </div>
  </section>

  <script src="main.js"></script>
  <script type="module">
    import { db, auth, firebaseConfig } from './firebase-config.js';
    import { initializeApp, deleteApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
    import { doc, setDoc, getDoc, collection, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
    import { onAuthStateChanged, signOut, getAuth, createUserWithEmailAndPassword, signOut as secondarySignOut } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';

    // ═══ Guard de acceso: debe haber sesión Y estar en la colección staff ═══
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'staff-login.html'; return; }
      const staffSnap = await getDoc(doc(db, 'staff', user.uid));
      if (!staffSnap.exists()) {
        await signOut(auth);
        window.location.href = 'staff-login.html';
        return;
      }
      document.getElementById('sessionLabel').textContent = `Sesión: ${user.email}`;
      loadRoster();
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'staff-login.html';
    });

    // ═══ Agregar personal nuevo ═══
    // Se crea la cuenta en una app secundaria de Firebase para no cerrar
    // la sesión de quien está dando de alta al nuevo personal.
    const addStaffMsg = document.getElementById('addStaffMsg');

    document.getElementById('addStaffBtn').addEventListener('click', async () => {
      const email = document.getElementById('staffEmail').value.trim();
      const password = document.getElementById('staffPassword').value;
      addStaffMsg.hidden = true;
      if (!email || password.length < 6) {
        addStaffMsg.textContent = 'Escribe un email y una contraseña de al menos 6 caracteres.';
        addStaffMsg.hidden = false;
        return;
      }

      const secondaryApp = initializeApp(firebaseConfig, 'staffCreation-' + Date.now());
      const secondaryAuth = getAuth(secondaryApp);
      try {
        const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
        const newUid = cred.user.uid;
        await secondarySignOut(secondaryAuth);
        await deleteApp(secondaryApp);

        await setDoc(doc(db, 'staff', newUid), {
          role: 'staff',
          email,
          addedBy: auth.currentUser.email,
          addedAt: serverTimestamp(),
        });

        addStaffMsg.textContent = `Cuenta de personal creada para ${email}.`;
        addStaffMsg.style.color = 'var(--green)';
        addStaffMsg.hidden = false;
        document.getElementById('staffEmail').value = '';
        document.getElementById('staffPassword').value = '';
        loadRoster();
      } catch (err) {
        await deleteApp(secondaryApp).catch(() => {});
        addStaffMsg.textContent = 'No se pudo crear la cuenta (¿ese email ya está en uso?).';
        addStaffMsg.style.color = 'var(--rust)';
        addStaffMsg.hidden = false;
      }
    });

    async function loadRoster() {
      const roster = document.getElementById('staffRoster');
      roster.innerHTML = '';
      try {
        const snap = await getDocs(collection(db, 'staff'));
        snap.forEach((d) => {
          const li = document.createElement('li');
          li.textContent = d.data().email || d.id;
          roster.appendChild(li);
        });
      } catch (err) { /* silencioso — el roster es solo informativo */ }
    }
  </script>
</body>
</html>
